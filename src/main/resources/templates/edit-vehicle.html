<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Edit Vehicle</title>

<style>

body{

font-family:Arial;
background:#f4f4f4;
margin:40px;

}

.container{

width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;

}

input,textarea,select{

width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;

}

button{

width:100%;
padding:15px;
background:green;
color:white;
border:none;
cursor:pointer;

}

</style>

</head>

<body>

<div class="container">

<h2>Edit Vehicle</h2>

<form th:action="@{/admin/save}" th:object="${vehicle}" method="post"  enctype="multipart/form-data">

<input type="hidden" th:field="*{id}">

<label>Make</label>
<input type="text" th:field="*{make}">

<label>Model</label>
<input type="text" th:field="*{model}">

<label>Year</label>
<input type="number" th:field="*{year}">

<label>Price</label>
<input type="number" step="0.01" th:field="*{price}">

<label>Mileage</label>
<input type="number" th:field="*{mileage}">

<label>Fuel Type</label>

<select th:field="*{fuelType}">
<option value="Petrol">Petrol</option>
<option value="Diesel">Diesel</option>
<option value="Hybrid">Hybrid</option>
<option value="Electric">Electric</option>
</select>

<label>Transmission</label>

<select th:field="*{transmission}">
<option value="Manual">Manual</option>
<option value="Automatic">Automatic</option>
</select>

<label>Image URL</label>

<input type="file" name="imageFile">

<label>Description</label>

<textarea rows="5" th:field="*{description}"></textarea>

<button>

Update Vehicle

</button>

</form>

</div>

</body>

</html>
