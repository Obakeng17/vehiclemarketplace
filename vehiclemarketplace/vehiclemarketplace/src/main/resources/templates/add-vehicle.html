<form th:action="@{/admin/save}"
      th:object="${vehicle}"
      method="post"
      enctype="multipart/form-data">

    <label>Vehicle Make</label>
    <input type="text"
           th:field="*{make}"
           placeholder="e.g. Toyota"
           required>

    <label>Vehicle Model</label>
    <input type="text"
           th:field="*{model}"
           placeholder="e.g. Hilux GD-6"
           required>

    <label>Year</label>
    <input type="number"
           th:field="*{year}"
           min="1990"
           max="2035"
           required>

    <label>Vehicle Category</label>
    <select th:field="*{category}" required>
        <option value="">-- Select Category --</option>
        <option>Sedan</option>
        <option>SUV</option>
        <option>Hatchback</option>
        <option>Bakkie</option>
        <option>Coupe</option>
        <option>Convertible</option>
        <option>Van</option>
        <option>Truck</option>
        <option>Others</option>
    </select>

    <label>Price (R)</label>
    <input type="number"
           step="0.01"
           th:field="*{price}"
           required>

    <label>Mileage (KM)</label>
    <input type="number"
           th:field="*{mileage}"
           required>

    <label>Colour</label>
    <input type="text"
           th:field="*{colour}"
           placeholder="e.g. White"
           required>

    <label>Condition</label>
    <select th:field="*{condition}" required>
        <option value="">-- Select Condition --</option>
        <option>New</option>
        <option>Used</option>
    </select>

    <label>Engine Size</label>
    <input type="text"
           th:field="*{engineSize}"
           placeholder="e.g. 2.8 GD-6">

    <label>Fuel Type</label>
    <select th:field="*{fuelType}" required>
        <option value="">-- Select Fuel Type --</option>
        <option>Petrol</option>
        <option>Diesel</option>
        <option>Hybrid</option>
        <option>Electric</option>
    </select>

    <label>Transmission</label>
    <select th:field="*{transmission}" required>
        <option value="">-- Select Transmission --</option>
        <option>Manual</option>
        <option>Automatic</option>
    </select>

    <label>Stock Number</label>
    <input type="text"
           th:field="*{stockNumber}"
           placeholder="e.g. BK001">

    <label>Availability</label>
    <select th:field="*{availability}">
        <option value="">-- Select Availability --</option>
        <option>Available</option>
        <option>Reserved</option>
        <option>Sold</option>
    </select>

    <label>Vehicle Image</label>
    <input type="file"
           name="imageFile"
           accept="image/*"
           required>

    <label>Description</label>
    <textarea th:field="*{description}"
              rows="5"
              placeholder="Enter a detailed description of the vehicle..."></textarea>

    <button type="submit">
        Save Vehicle
    </button>

</form>
