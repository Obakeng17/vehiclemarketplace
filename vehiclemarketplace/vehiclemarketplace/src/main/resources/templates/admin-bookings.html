<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Booking Management</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

h1{
    margin-bottom:25px;
}

.stats{
    display:flex;
    gap:20px;
    margin-bottom:30px;
    flex-wrap:wrap;
}

.card{
    flex:1;
    min-width:180px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
    text-align:center;
}
.btn-custom {
  display: inline-block;
  padding: 10px 20px;
  background: linear-gradient(135deg, #4CAF50, #2E7D32);
  color: #fff;
  font-weight: 600;
  text-decoration: none;
  border-radius: 6px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.15);
  transition: all 0.3s ease;
}

.btn-custom:hover {
  background: linear-gradient(135deg, #66BB6A, #388E3C);
  transform: translateY(-2px);
  box-shadow: 0 6px 10px rgba(0,0,0,0.2);
}


.card h2{
    font-size:32px;
    color:#0b5ed7;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0b5ed7;
    color:white;
    padding:15px;
}

td{
    padding:14px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

.status{

    padding:6px 14px;
    border-radius:20px;
    color:white;
    font-weight:bold;

}

.pending{

    background:orange;

}

.approved{

    background:green;

}

.declined{

    background:red;

}

.completed{

    background:#0b5ed7;

}

.btn{

padding:8px 14px;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
text-decoration:none;

}

.approve{

background:green;

}

.decline{

background:red;

}

.complete{

background:#0b5ed7;

}

</style>

</head>

<body>

<h1>Booking Management</h1>

<div class="stats">

<div class="card">

<h3>Total Bookings</h3>

<h2 th:text="${totalBookings}"></h2>

</div>

<div class="card">

<h3>Pending</h3>

<h2 th:text="${pendingBookings}"></h2>

</div>

<div class="card">

<h3>Approved</h3>

<h2 th:text="${approvedBookings}"></h2>

</div>

<div class="card">

<h3>Completed</h3>

<h2 th:text="${completedBookings}"></h2>

</div>

</div>

<table>

<thead>
<a th:href="@{/admin/bookings}" class="btn-custom">
    View Bookings
</a>
<tr>

<th>Customer</th>

<th>Vehicle</th>

<th>Date</th>

<th>Time</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody>

<tr th:each="booking : ${bookings}">

<td>

<span th:text="${booking.firstName}"></span>

<span th:text="${booking.lastName}"></span>

</td>

<td>

<span th:text="${booking.vehicle.make}"></span>

<span th:text="${booking.vehicle.model}"></span>

</td>

<td th:text="${booking.bookingDate}"></td>

<td th:text="${booking.bookingTime}"></td>

<td>

<span
th:class="'status ' + ${#strings.toLowerCase(booking.status)}"
th:text="${booking.status}">
</span>

</td>

<td>

<a
th:href="@{/admin/bookings/approve/{id}(id=${booking.id})}"
class="btn approve">

Approve

</a>

<a
th:href="@{/admin/bookings/decline/{id}(id=${booking.id})}"
class="btn decline">

Decline

</a>

<a
th:href="@{/admin/bookings/complete/{id}(id=${booking.id})}"
class="btn complete">

Complete

</a>

</td>

</tr>

</tbody>

</table>

</body>

</html>
