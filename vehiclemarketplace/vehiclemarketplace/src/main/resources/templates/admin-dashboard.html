<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f4f4;
            margin:40px;
        }

        h1{
            text-align:center;
        }

        .top{
            margin-bottom:20px;
        }

        .btn{
            background:#007BFF;
            color:white;
            padding:10px 20px;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#0056b3;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        table th,table td{
            border:1px solid #ddd;
            padding:12px;
            text-align:center;
        }

        table th{
            background:#007BFF;
            color:white;
        }

        img{
            width:120px;
            border-radius:5px;
        }

        .delete{
            color:red;
            text-decoration:none;
        }

    </style>

</head>

<body>

<h1>Vehicle Marketplace Admin</h1>

<div class="top">

<a href="/admin/add" class="btn">
Add Vehicle
</a>

</div>
<div style="display:flex; gap:20px; margin-bottom:30px;">

    <div style="flex:1; background:#0d6efd; color:white; padding:20px; border-radius:10px;">
        <h3>Total Vehicles</h3>
        <h1 th:text="${totalVehicles}"></h1>
    </div>

    <div style="flex:1; background:#198754; color:white; padding:20px; border-radius:10px;">
        <h3>Diesel Vehicles</h3>
        <h1 th:text="${dieselVehicles}"></h1>
    </div>

</div>

<form th:action="@{/admin/search}" method="get" style="margin-bottom:20px;">

    <input type="text"
           name="keyword"
           placeholder="Search by make..."
           style="padding:10px; width:300px;">

    <button type="submit">Search</button>

</form>
<table>

<tr>

<th>ID</th>
<th>Image</th>
<th>Make</th>
<th>Model</th>
<th>Year</th>
<th>Price</th>
<th>Mileage</th>
<th>Fuel</th>
<th>Transmission</th>
<th>Actions</th>

</tr>

<tr th:each="vehicle : ${vehicles}">

<td th:text="${vehicle.id}"></td>

<td>
<img th:src="@{'/uploads/' + ${vehicle.imageUrl}}"
     width="150">
</td>

<td th:text="${vehicle.make}"></td>

<td th:text="${vehicle.model}"></td>

<td th:text="${vehicle.year}"></td>

<td th:text="${vehicle.price}"></td>

<td th:text="${vehicle.mileage}"></td>

<td th:text="${vehicle.fuelType}"></td>

<td th:text="${vehicle.transmission}"></td>

<td>

<a th:href="@{'/admin/edit/' + ${vehicle.id}}">
    Edit
</a>

&nbsp; | &nbsp;

<a th:href="@{'/admin/delete/' + ${vehicle.id}}"
   class="delete">
    Delete
</a>

</td>

</tr>

</table>

</body>
</html>
